<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Camera Previewer + Controller · media‑sync‑api</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      position: fixed;
      touch-action: none;
    }

    /* Camera stage: fullscreen, fitted to orientation */
    .camera-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: auto;
      background: #000;
      transition: filter 0.15s ease;
    }

    /* shutter flash effect */
    .camera-stage.flash video {
      filter: brightness(1.4) contrast(1.2);
    }

    /* ---- OVERLAY CONTROLS (glassmorphic, fades out) ---- */
    .controls-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(28px, 10vw, 70px);
      padding: 24px 20px 32px 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.25) 60%, transparent 100%);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.18);
      transition: opacity 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1), visibility 0.35s;
      pointer-events: auto;
      z-index: 20;
    }

    /* fade-out (inactive) state */
    .controls-overlay.inactive {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s step-end;
    }

    /* button base style */
    .cam-btn {
      background: rgba(25, 25, 30, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 64px;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s, border-color 0.15s;
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }

    .cam-btn:active {
      transform: scale(0.94);
      background: rgba(40, 45, 55, 0.9);
      border-color: rgba(255,255,255,0.45);
    }

    .cam-btn svg {
      width: 38px;
      height: 38px;
      stroke: white;
      stroke-width: 1.2;
      fill: white;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* capture button larger / special style */
    .capture-btn {
      background: rgba(255, 70, 90, 0.88);
      border-color: rgba(255, 255, 255, 0.6);
      width: 86px;
      height: 86px;
    }
    .capture-btn svg {
      width: 44px;
      height: 44px;
      fill: white;
      stroke: none;
    }

    .status-tag {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 60px;
      font-size: 13px;
      font-weight: 500;
      font-family: system-ui, -apple-system, 'Segoe UI', monospace;
      letter-spacing: 0.3px;
      color: rgba(255,250,220,0.92);
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 22;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .error-banner {
      position: fixed;
      bottom: 30px;
      left: 20px;
      right: 20px;
      background: rgba(220, 40, 60, 0.92);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 14px 20px;
      text-align: center;
      font-family: system-ui;
      font-weight: 500;
      font-size: 15px;
      color: white;
      border: 1px solid rgba(255,200,200,0.5);
      z-index: 25;
      pointer-events: auto;
      transition: transform 0.2s, opacity 0.2s;
    }

    .retry-btn {
      background: white;
      color: black;
      border: none;
      margin-left: 16px;
      padding: 6px 18px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .toast-msg {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: rgba(25,25,30,0.9);
      backdrop-filter: blur(14px);
      border-radius: 40px;
      padding: 10px 22px;
      font-family: system-ui;
      font-weight: 500;
      font-size: 14px;
      color: #f0f0f0;
      border: 1px solid rgba(255,255,255,0.25);
      white-space: nowrap;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.2s, transform 0.15s;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* hint message */
    .tap-hint {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      font-family: system-ui;
      color: rgba(255,255,210,0.65);
      background: transparent;
      pointer-events: none;
      z-index: 18;
      transition: opacity 0.4s;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px black;
    }

    .controls-overlay.inactive ~ .tap-hint {
      opacity: 1;
    }

    .controls-overlay:not(.inactive) ~ .tap-hint {
      opacity: 0;
      transition: opacity 0.25s;
    }

    @media (max-width: 540px) {
      .cam-btn { width: 64px; height: 64px; }
      .capture-btn { width: 78px; height: 78px; }
      .cam-btn svg { width: 32px; height: 32px; }
      .capture-btn svg { width: 40px; height: 40px; }
      .controls-overlay { gap: 24px; padding: 20px 20px 28px; }
    }
  </style>
</head>
<body>

<div class="camera-stage" id="cameraStage">
  <video id="cameraVideo" autoplay playsinline muted disablePictureInPicture></video>
  <div class="controls-overlay" id="controlsOverlay">
    <div class="cam-btn" id="flipCameraBtn" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.25" fill="none"/>
        <path d="M7.25 9.25A5.8 5.8 0 0 1 15.7 7.2"/>
        <path d="M15.7 7.2h-2.4"/>
        <path d="M15.7 7.2v-2.4"/>
        <path d="M16.75 14.75A5.8 5.8 0 0 1 8.3 16.8"/>
        <path d="M8.3 16.8h2.4"/>
        <path d="M8.3 16.8v2.4"/>
      </svg>
    </div>

    <div class="cam-btn capture-btn" id="capturePhotoBtn" aria-label="Take photo">
      <svg viewBox="0 0 24 24" fill="white">
        <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.2" fill="none"/>
        <circle cx="12" cy="12" r="4" fill="white"/>
        <path d="M19 7 L21 9 L19 11" stroke="white" stroke-width="1.5" fill="none"/>
        <path d="M5 7 L3 9 L5 11" stroke="white" stroke-width="1.5" fill="none"/>
      </svg>
    </div>

    <div class="cam-btn" id="toggleControlsBtn" aria-label="Lock / Hide UI">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.4">
        <rect x="4" y="10" width="16" height="11" rx="2" fill="none" stroke="white"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="white" fill="none"/>
        <circle cx="12" cy="15" r="1.5" fill="white"/>
        <line x1="12" y1="16.5" x2="12" y2="18" stroke="white"/>
      </svg>
    </div>
  </div>
  <div class="status-tag" id="statusTag">📷 Camera · ready</div>
  <div class="tap-hint" id="tapHint">⚡ tap anywhere — controls fade on idle</div>
</div>
<div class="toast-msg" id="toastMsg"></div>

<script>
  (function() {
    // ----- DOM elements -----
    const video = document.getElementById('cameraVideo');
    const controlsDiv = document.getElementById('controlsOverlay');
    const flipBtn = document.getElementById('flipCameraBtn');
    const captureBtn = document.getElementById('capturePhotoBtn');
    const toggleControlsBtn = document.getElementById('toggleControlsBtn');
    const statusTag = document.getElementById('statusTag');
    const toastMsgDiv = document.getElementById('toastMsg');
    const cameraStage = document.getElementById('cameraStage');

    // ----- state -----
    let currentStream = null;
    let currentFacingMode = 'environment';   // start with rear/environment camera (better for typical use)
    let cameraActive = false;
    let isOverlayLocked = false;              // user can "lock" overlay to stay visible
    let idleTimeout = null;
    let flashTimeout = null;

    // ----- helper: fade toast -----
    function showToast(text, duration = 1500) {
      toastMsgDiv.textContent = text;
      toastMsgDiv.classList.add('show');
      clearTimeout(toastMsgDiv._hideTimer);
      toastMsgDiv._hideTimer = setTimeout(() => {
        toastMsgDiv.classList.remove('show');
      }, duration);
    }

    // ----- update status badge -----
    function updateStatusLabel(text, isError = false) {
      statusTag.innerHTML = text;
      if (isError) {
        statusTag.style.backgroundColor = 'rgba(200, 40, 60, 0.8)';
        statusTag.style.borderColor = '#ffaa88';
      } else {
        statusTag.style.backgroundColor = 'rgba(0,0,0,0.55)';
        statusTag.style.borderColor = 'rgba(255,255,255,0.2)';
      }
    }

    // ----- flash animation for photo capture -----
    function triggerShutterFlash() {
      if (flashTimeout) clearTimeout(flashTimeout);
      cameraStage.classList.add('flash');
      flashTimeout = setTimeout(() => {
        cameraStage.classList.remove('flash');
      }, 120);
    }

    // ----- take photo from video stream & download -----
    function capturePhoto() {
      if (!video.videoWidth || !video.videoHeight || !cameraActive) {
        showToast('⚠️ Camera not ready', 1000);
        return;
      }
      try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Create download link
        canvas.toBlob((blob) => {
          if (!blob) {
            showToast('❌ Capture failed', 1000);
            return;
          }
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
          a.download = `camera_${timestamp}.png`;
          a.href = url;
          a.click();
          URL.revokeObjectURL(url);
          showToast('📸 Photo saved', 1100);
          triggerShutterFlash();
        }, 'image/png');
      } catch (err) {
        console.error('capture error', err);
        showToast('Capture error', 1000);
      }
    }

    // ----- stop tracks properly -----
    async function stopCurrentStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => {
          if (track.readyState === 'live') track.stop();
        });
        currentStream = null;
      }
      if (video.srcObject) {
        video.srcObject = null;
      }
    }

    // ----- start camera with specific facing mode -----
    async function startCamera(facingMode) {
      await stopCurrentStream();
      const constraints = {
        video: {
          facingMode: { exact: facingMode },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };
      
      // fallback if exact fails (some browsers reject exact)
      let stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (exactErr) {
        console.warn('exact facingMode failed, trying ideal', exactErr);
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }
          });
        } catch (fallbackErr) {
          // ultimate fallback: any camera
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
          showToast(`⚠️ Using default camera`, 1400);
        }
      }
      
      if (!stream) throw new Error('No camera stream');
      
      currentStream = stream;
      video.srcObject = stream;
      await video.play().catch(e => console.warn('play warning', e));
      cameraActive = true;
      const facingLabel = facingMode === 'user' ? '📸 Front' : '📷 Back';
      updateStatusLabel(`${facingLabel} · live`);
      return true;
    }

    // ----- switch camera front/back -----
    async function switchCamera() {
      if (!cameraActive) {
        showToast('Camera not initialized', 800);
        return;
      }
      const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      updateStatusLabel('🔄 switching...');
      try {
        await startCamera(newMode);
        currentFacingMode = newMode;
        showToast(`Switched to ${currentFacingMode === 'user' ? 'front' : 'rear'} camera`, 1000);
      } catch (err) {
        console.error('switch camera error', err);
        updateStatusLabel('⚠️ Switch failed', true);
        showToast('Cannot switch camera', 1200);
        // keep old stream alive, attempt recovery -> retry old mode
        if (!currentStream || currentStream.getVideoTracks().length === 0) {
          await startCamera(currentFacingMode);
        }
      }
    }

    // ----- RESET IDLE TIMER FOR CONTROLS FADE (if not locked)-----
    function resetIdleTimer() {
      if (isOverlayLocked) return;
      // make controls visible instantly
      controlsDiv.classList.remove('inactive');
      // clear previous timer
      if (idleTimeout) clearTimeout(idleTimeout);
      // set new timer to fade after 2.7 seconds of inactivity
      idleTimeout = setTimeout(() => {
        if (!isOverlayLocked) {
          controlsDiv.classList.add('inactive');
        }
      }, 2700);
    }

    // ----- lock/unlock overlay (always visible) -----
    function toggleOverlayLock() {
      isOverlayLocked = !isOverlayLocked;
      if (isOverlayLocked) {
        // locked: remove inactive and clear timer
        if (idleTimeout) clearTimeout(idleTimeout);
        controlsDiv.classList.remove('inactive');
        showToast('🔒 Controls always visible', 1000);
        updateStatusLabel(`${currentFacingMode === 'user' ? 'Front' : 'Rear'} · pinned`, false);
        setTimeout(() => {
          if (currentFacingMode === 'user') updateStatusLabel('📸 Front · pinned', false);
          else updateStatusLabel('📷 Rear · pinned', false);
        }, 1300);
      } else {
        showToast('🔓 Auto‑hide active', 900);
        updateStatusLabel(`${currentFacingMode === 'user' ? 'Front' : 'Rear'} · auto‑hide`, false);
        // reset idle state: make visible and start timer
        controlsDiv.classList.remove('inactive');
        resetIdleTimer();
        setTimeout(() => {
          if (!isOverlayLocked && currentFacingMode === 'user') updateStatusLabel('📸 Front · live', false);
          else if (!isOverlayLocked) updateStatusLabel('📷 Back · live', false);
        }, 1400);
      }
    }

    // ----- manual wake (for any global interaction) -----
    function wakeOverlayFromIdle() {
      if (!isOverlayLocked && controlsDiv.classList.contains('inactive')) {
        controlsDiv.classList.remove('inactive');
        resetIdleTimer();
      } else if (!isOverlayLocked) {
        resetIdleTimer();   // refresh timer
      }
    }

    // ----- global event listeners to reset idle timer (touch, mouse, key) -----
    function bindActivityWatchers() {
      const events = ['touchstart', 'mousedown', 'keydown', 'mousemove'];
      events.forEach(ev => {
        window.addEventListener(ev, (e) => {
          // ignore if the lock prevents fading, but still we keep it visible
          if (!isOverlayLocked) {
            wakeOverlayFromIdle();
          } else {
            // if locked, always visible, but we just ensure it's not inactive.
            if (controlsDiv.classList.contains('inactive')) controlsDiv.classList.remove('inactive');
            if (idleTimeout) clearTimeout(idleTimeout);
          }
        }, { passive: true });
      });
    }

    // ----- initialize camera with default (environment/back) & setup UI -----
    async function initCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Camera API not supported');
        }
        // try environment (rear) first
        await startCamera('environment');
        currentFacingMode = 'environment';
        cameraActive = true;
        updateStatusLabel('📷 Rear camera · ready');
        showToast('Camera ready · tap for controls', 1800);
      } catch (err) {
        console.error('Camera init error:', err);
        cameraActive = false;
        updateStatusLabel('⚠️ Camera error', true);
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-banner';
        errorDiv.id = 'cameraErrorBanner';
        errorDiv.innerHTML = `📷 Cannot access camera · ${err.message || 'Permission denied'}<button class="retry-btn" id="retryCameraBtn">Retry</button>`;
        document.body.appendChild(errorDiv);
        const retryBtn = document.getElementById('retryCameraBtn');
        if (retryBtn) {
          retryBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            errorDiv.remove();
            await initCamera();
          });
        }
        return;
      }
    }

    // ----- helper to handle orientation & video fitting (already covered by CSS cover) -----
    // but we also listen for window resize to re-center if needed (handled by css)
    
    // ----- BUTTON EVENT HANDLERS -----
    function attachButtonEvents() {
      if (flipBtn) {
        flipBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          wakeOverlayFromIdle();
          await switchCamera();
        });
      }
      if (captureBtn) {
        captureBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          wakeOverlayFromIdle();
          capturePhoto();
        });
      }
      if (toggleControlsBtn) {
        toggleControlsBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleOverlayLock();
        });
      }
    }

    // ---- prevent contextmenu and long press on whole interface ----
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());
    
    // ---- ensure that video container fits in orientation (just CSS) ----
    // also handle window resize to keep controls overlay position fresh
    window.addEventListener('resize', () => {
      // no heavy ops, but we reset idle if controls need to adapt because of layout shift
      if (!isOverlayLocked) resetIdleTimer();
    });
    
    // ---- Force idle state after initial load: start visible & start timer ----
    function startInitialIdleCycle() {
      controlsDiv.classList.remove('inactive');   // start visible
      if (idleTimeout) clearTimeout(idleTimeout);
      idleTimeout = setTimeout(() => {
        if (!isOverlayLocked) {
          controlsDiv.classList.add('inactive');
        }
      }, 2800);
    }

    // ---- manual interaction on video itself also resets idle and flash-----
    if (video) {
      video.addEventListener('touchstart', () => wakeOverlayFromIdle());
      video.addEventListener('mousedown', () => wakeOverlayFromIdle());
    }
    
    // ---- additional safety for missing video initial display -----
    function ensureVideoPlaying() {
      if (video && video.paused && cameraActive && currentStream) {
        video.play().catch(e => console.warn('autoplay resume', e));
      }
    }
    setInterval(ensureVideoPlaying, 800);
    
    // ---- boot system ----
    async function boot() {
      attachButtonEvents();
      bindActivityWatchers();
      await initCamera();
      startInitialIdleCycle();
      // add extra reset on document tap even if overlay hidden
      document.body.addEventListener('touchstart', () => {
        if (!isOverlayLocked && controlsDiv.classList.contains('inactive')) {
          wakeOverlayFromIdle();
        }
      }, { passive: true });
      document.body.addEventListener('mousedown', () => {
        if (!isOverlayLocked && controlsDiv.classList.contains('inactive')) wakeOverlayFromIdle();
      });
    }
    
    boot().catch(err => {
      console.error('Fatal boot error', err);
      updateStatusLabel('Camera failed', true);
    });
    
    // expose helper for debugging (optional)
    window.__cameraController = {
      switchCamera, capturePhoto, toggleLock: toggleOverlayLock
    };
  })();
</script>
</body>
</html>
