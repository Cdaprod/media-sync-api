## Explorer UI (Next.js dual-lane compose: dev + prod)
# Usage (dev/HMR):
#   docker compose -f docker/docker-compose.explorer.yaml --profile dev up --build
# Usage (prod image lane):
#   docker compose -f docker/docker-compose.explorer.yaml --profile prod up --build

x-explorer-build: &explorer_build
  context: ..
  dockerfile: docker/Explorer/Dockerfile

services:
  explorer-dev:
    profiles: ["dev"]
    build:
      <<: *explorer_build
      target: dev
    working_dir: /workspace/docker/packages/Explorer
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ..:/workspace
      - explorer_node_modules:/workspace/docker/packages/Explorer/node_modules

  explorer-prod:
    profiles: ["prod"]
    build:
      <<: *explorer_build
      target: runner
    working_dir: /workspace/docker/packages/Explorer
    command: npm run start
    ports:
      - "8790:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_MEDIA_SYNC_API_BASE: ${NEXT_PUBLIC_MEDIA_SYNC_API_BASE:-http://192.168.0.25:8787}

volumes:
  explorer_node_modules:
